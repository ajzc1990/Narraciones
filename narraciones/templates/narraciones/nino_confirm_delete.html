<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baja de Niño/a - Narraciones Interactivas</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f0f9ff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 md:p-10 rounded-[2.5rem] shadow-xl border border-rose-100 text-center">
        <span class="text-5xl block mb-4">⚠️</span>
        <h1 class="text-xl font-extrabold text-slate-800 mb-2">Eliminar Usuario</h1>
        <p class="text-slate-500 text-sm mb-6">
            ¿Confirmás la baja de <span class="font-bold text-slate-800">{{ nino.apellido }}, {{ nino.nombre }}</span>?
            Esta acción no se puede deshacer.
        </p>

        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-full shadow-lg transition-all">
                Aceptar
            </button>
            <a href="{% url 'narraciones:nino_lista' %}" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3.5 rounded-full transition-all">
                Cancelar
            </a>
        </form>
    </div>

    <!-- Botón de Ayuda flotante (RNF-02) -->
    <a href="{% url 'narraciones:ayuda' %}" target="_blank" title="Ayuda"
       class="fixed bottom-5 right-5 z-50 bg-amber-400 hover:bg-amber-500 text-slate-900 w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-2xl font-extrabold transition-transform hover:scale-110">
        ?
    </a>
</body>
</html>
