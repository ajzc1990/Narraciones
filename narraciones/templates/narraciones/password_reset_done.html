<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisá tu Correo - Narraciones Interactivas</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f0f9ff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 md:p-10 rounded-[2.5rem] shadow-xl border border-blue-100 text-center">
        <span class="text-5xl block mb-4">📧</span>
        <h1 class="text-xl font-extrabold text-slate-800 mb-2">Revisá tu correo</h1>
        <p class="text-slate-500 text-sm mb-6">
            Si el e-mail que ingresaste corresponde a una cuenta registrada, te enviamos un enlace para crear una
            nueva contraseña. Puede tardar unos minutos en llegar; revisá también la carpeta de spam.
        </p>
        <a href="{% url 'narraciones:login' %}" class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all text-sm">
            ⬅ Volver a Iniciar Sesión
        </a>
    </div>
</body>
</html>
