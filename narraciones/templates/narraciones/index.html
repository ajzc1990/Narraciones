<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narraciones Interactivas - Panel de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f0f9ff;
        }

        .pergamino {
            background-color: #fffdf0;
            border-left: 6px solid #f59e0b;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
        }

        .pictograma-anim {
            animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .recording-dot {
            animation: pulseRecord 1.2s infinite;
        }

        @keyframes pulseRecord {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.4; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-16">

    <!-- Encabezado Principal -->
    <header class="w-full bg-blue-600 text-white py-5 shadow-lg text-center relative mb-6">
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight">🎙️ Narraciones Interactivas</h1>
        <p class="text-blue-100 text-xs md:text-sm font-semibold uppercase tracking-wider mt-1">Plataforma de Estimulación Lingüística</p>
        
        <!-- Enlace al Dashboard Docente -->
        <a href="{% url 'narraciones:historial_sesiones' %}" class="absolute top-4 right-4 md:right-8 bg-blue-500 hover:bg-blue-700 text-white text-xs font-bold py-2 px-4 rounded-full transition-all shadow-md flex items-center gap-2">
            <span>📊</span> <span class="hidden sm:inline">HISTORIAL</span>
        </a>
    </header>

    <!-- Contenedor de Configuración y Selección -->
    <main class="w-11/12 max-w-4xl bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-blue-100 space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col">
                <label for="nino-select" class="text-blue-700 font-bold mb-2 text-sm flex items-center gap-2">
                    <span>👶</span> Alumno narrador:
                </label>
                <select id="nino-select" class="p-3 border-2 border-blue-100 rounded-2xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all cursor-pointer text-gray-700 text-sm font-semibold">
                    <option value="">-- Seleccionar un alumno --</option>
                    {% for nino in ninos %}
                        <option value="{{ nino.id }}">{{ nino.apellido }}, {{ nino.nombre }} ({{ nino.edad }} años)</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex flex-col">
                <label for="cuento-select" class="text-blue-700 font-bold mb-2 text-sm flex items-center gap-2">
                    <span>📖</span> Cuento seleccionado:
                </label>
                <select id="cuento-select" onchange="actualizarCuento()" class="p-3 border-2 border-blue-100 rounded-2xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all cursor-pointer text-gray-700 text-sm font-semibold">
                    <option value="">-- Seleccionar un cuento --</option>
                    {% for cuento in cuentos %}
                        <option value="{{ cuento.cuerpo_cuento }}" data-id="{{ cuento.id }}" data-categoria="{{ cuento.get_categoria_edad_display }}">
                            {{ cuento.titulo }} [{{ cuento.get_categoria_edad_display }}]
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Texto de Apoyo / Guía de Narración -->
        <div id="guia-narracion" class="hidden pergamino p-5 rounded-2xl">
            <div class="flex justify-between items-center mb-2">
                <h4 class="text-amber-800 text-xs font-bold uppercase tracking-widest">📜 Texto de apoyo pedagógico:</h4>
                <span id="categoria-badge" class="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-full"></span>
            </div>
            <p id="texto-guia-contenido" class="text-base md:text-lg leading-relaxed text-gray-800 font-medium"></p>
        </div>

        <!-- Transcripción en Vivo -->
        <div id="live-speech-box" class="hidden bg-slate-50 border border-slate-200 p-4 rounded-2xl text-center">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">Transcripción en tiempo real:</span>
            <p id="live-speech-text" class="text-blue-600 font-semibold italic text-sm md:text-base">Escuchando voz...</p>
        </div>
    </main>

    <!-- Barra de Estado y Controles de Grabación -->
    <div class="mt-6 flex flex-col items-center gap-4">
        <div id="status-bar" class="bg-white px-5 py-2.5 rounded-full shadow-md flex items-center gap-3 border border-slate-100">
            <div id="dot" class="w-3 h-3 bg-slate-300 rounded-full"></div>
            <span id="status-text" class="font-bold text-slate-500 uppercase text-xs tracking-wider">Esperando configuración</span>
        </div>

        <div class="flex flex-wrap justify-center gap-3">
            <button id="start-btn" disabled class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 px-7 rounded-full shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 disabled:bg-slate-300 disabled:cursor-not-allowed flex items-center gap-2">
                <span>🎤</span> INICIAR NARRACIÓN
            </button>
            <button id="stop-btn" class="hidden bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 px-7 rounded-full shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center gap-2">
                <span>⏹️</span> FINALIZAR ACTIVIDAD
            </button>
            <button id="clear-btn" class="bg-slate-400 hover:bg-slate-500 text-white font-bold py-3.5 px-6 rounded-full shadow-md transition-all flex items-center gap-2">
                <span>🗑️</span> LIMPIAR LIENZO
            </button>
        </div>
    </div>

    <!-- Lienzo de Pictogramas Dinámicos -->
    <section class="w-11/12 max-w-6xl mt-10">
        <h3 class="text-slate-500 text-xs font-bold uppercase tracking-widest text-center mb-6">Pictogramas identificados</h3>
        <div id="lienzo-pictogramas" class="flex flex-wrap justify-center gap-6">
            <!-- Renderizado dinámico vía JavaScript -->
        </div>
    </section>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const clearBtn = document.getElementById('clear-btn');
        const statusText = document.getElementById('status-text');
        const dot = document.getElementById('dot');
        const ninoSelect = document.getElementById('nino-select');
        const cuentoSelect = document.getElementById('cuento-select');
        const guiaNarracion = document.getElementById('guia-narracion');
        const textoGuiaContenido = document.getElementById('texto-guia-contenido');
        const categoriaBadge = document.getElementById('categoria-badge');
        const liveSpeechBox = document.getElementById('live-speech-box');
        const liveSpeechText = document.getElementById('live-speech-text');
        const lienzo = document.getElementById('lienzo-pictogramas');

        let cuentoIdActual = null;
        let palabrasProcesadas = new Set();
        let grabandoActivo = false;
        let tiempoInicio = null;

        function actualizarCuento() {
            const selectedOption = cuentoSelect.options[cuentoSelect.selectedIndex];
            if (cuentoSelect.value) {
                cuentoIdActual = selectedOption.getAttribute('data-id');
                textoGuiaContenido.innerText = cuentoSelect.value;
                categoriaBadge.innerText = selectedOption.getAttribute('data-categoria') || '';
                guiaNarracion.classList.remove('hidden');
                startBtn.disabled = false;
                statusText.innerText = "LISTO PARA INICIAR";
                statusText.className = "font-bold text-emerald-600 uppercase text-xs tracking-wider";
            } else {
                guiaNarracion.classList.add('hidden');
                startBtn.disabled = true;
                statusText.innerText = "SELECCIONA CUENTO";
                statusText.className = "font-bold text-slate-500 uppercase text-xs tracking-wider";
                cuentoIdActual = null;
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.continuous = true;
            recognition.interimResults = true;

            startBtn.onclick = () => {
                if (!ninoSelect.value) {
                    alert("Por favor, selecciona primero al alumno/a que va a narrar.");
                    return;
                }
                palabrasProcesadas.clear();
                grabandoActivo = true;
                tiempoInicio = Date.now();
                liveSpeechBox.classList.remove('hidden');
                recognition.start();
            };

            stopBtn.onclick = () => {
                grabandoActivo = false;
                recognition.stop();

                const duracionSegundos = tiempoInicio ? Math.round((Date.now() - tiempoInicio) / 1000) : 0;

                if (cuentoIdActual && ninoSelect.value) {
                    const url = `{% url 'narraciones:finalizar_cuento' cuento_id=0 %}`
                        .replace('0', cuentoIdActual) + `?nino_id=${ninoSelect.value}&duracion=${duracionSegundos}`;
                    window.location.href = url;
                }
            };

            recognition.onstart = () => {
                statusText.innerText = "ESCUCHANDO NARRACIÓN...";
                statusText.className = "font-bold text-rose-600 uppercase text-xs tracking-wider";
                dot.className = "w-3 h-3 bg-rose-500 rounded-full recording-dot";
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                ninoSelect.disabled = true;
                cuentoSelect.disabled = true;
            };

            recognition.onend = () => {
                // Si el usuario no pulsó stop, reconectar automáticamente (anti-corte por silencio)
                if (grabandoActivo) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.warn("Reinicio de reconocimiento en curso:", e);
                    }
                } else {
                    statusText.innerText = "SESIÓN FINALIZADA";
                    statusText.className = "font-bold text-slate-500 uppercase text-xs tracking-wider";
                    dot.className = "w-3 h-3 bg-slate-300 rounded-full";
                    startBtn.classList.remove('hidden');
                    stopBtn.classList.add('hidden');
                    ninoSelect.disabled = false;
                    cuentoSelect.disabled = false;
                    liveSpeechBox.classList.add('hidden');
                }
            };

            recognition.onresult = (event) => {
                let transcripcionInterina = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const texto = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        const palabras = texto.toLowerCase()
                            .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()¿?¡!]/g, "")
                            .split(/\s+/);

                        palabras.forEach(palabra => {
                            if (palabra.length > 2 && !palabrasProcesadas.has(palabra)) {
                                buscarPictograma(palabra);
                                palabrasProcesadas.add(palabra);
                            }
                        });
                    } else {
                        transcripcionInterina += texto;
                    }
                }

                if (transcripcionInterina) {
                    liveSpeechText.innerText = `"${transcripcionInterina.trim()}"`;
                }
            };

            recognition.onerror = (event) => {
                if (event.error !== 'no-speech') {
                    console.error("Error en reconocimiento:", event.error);
                    statusText.innerText = `ERROR MICRO: ${event.error.toUpperCase()}`;
                }
            };
        } else {
            alert("Tu navegador no soporta reconocimiento de voz nativo. Recomendamos usar Google Chrome o Microsoft Edge.");
        }

        async function buscarPictograma(palabra) {
            try {
                const response = await fetch(`{% url 'narraciones:buscar_pictograma' %}?palabra=${encodeURIComponent(palabra)}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.encontrado) {
                        renderizarCardPictograma(data.url, data.nombre, data.tipo);
                    }
                }
            } catch (error) {
                console.error("Error al consultar pictograma:", error);
            }
        }

        function renderizarCardPictograma(url, nombre, tipo) {
            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-2xl shadow-md text-center pictograma-anim border-2 border-blue-50 w-44 hover:shadow-xl transition-shadow flex flex-col items-center";
            card.innerHTML = `
                <img src="${url}" alt="${nombre}" class="w-32 h-32 object-contain mb-3 rounded-lg">
                <span class="block text-blue-800 font-bold text-base capitalize leading-tight">${nombre}</span>
                <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest mt-1">${tipo || 'Pictograma'}</span>
            `;
            lienzo.appendChild(card);
        }

        clearBtn.onclick = () => {
            if (lienzo.children.length > 0 && confirm("¿Deseas limpiar todos los pictogramas de la pantalla?")) {
                lienzo.innerHTML = '';
                palabrasProcesadas.clear();
            }
        };
    </script>
</body>
</html>
