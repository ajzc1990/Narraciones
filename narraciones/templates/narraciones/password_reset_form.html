<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Narraciones Interactivas</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Quicksand', sans-serif; background-color: #f0f9ff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 md:p-10 rounded-[2.5rem] shadow-xl border border-blue-100">
        <div class="text-center mb-8">
            <span class="text-4xl block mb-2">🔑</span>
            <h1 class="text-2xl font-extrabold text-slate-800">¿Olvidaste tu contraseña?</h1>
            <p class="text-slate-400 text-sm font-semibold mt-1">Te enviamos un enlace para crear una nueva</p>
        </div>

        {% if form.errors %}
        <div class="bg-rose-50 border border-rose-200 text-rose-700 text-sm font-semibold p-4 rounded-2xl mb-5">
            Revisá el e-mail ingresado.
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-blue-700 font-bold mb-1.5 text-sm block">E-mail de tu cuenta</label>
                <input type="email" name="email" required autofocus
                    class="w-full p-3.5 border-2 border-blue-100 rounded-2xl focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition-all text-slate-700 font-medium">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-full shadow-lg transition-all mt-2">
                Enviar enlace de recuperación
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-6">
            <a href="{% url 'narraciones:login' %}" class="text-blue-600 font-bold hover:underline">⬅ Volver a Iniciar Sesión</a>
        </p>
    </div>
</body>
</html>
