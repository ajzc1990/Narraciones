name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr tests
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-no-usar-en-produccion
          DJANGO_DEBUG: "True"
        run: python manage.py test narraciones
